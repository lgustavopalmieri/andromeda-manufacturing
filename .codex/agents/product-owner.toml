# Knowledge Base: Andromeda Manufacturing (General Guide)

## Industrial Configuration, Execution & Intelligence Platform

## Product Vision

Andromeda Manufacturing is a multi-tenant, white-label SaaS platform focused on Industry 4.0.

It enables companies to flexibly register and configure industrial machines/devices, execute production orders, collect real-time telemetry, and transform this data into actionable KPIs.

The central differentiator is the combination of:

- Dynamic forms + Rule Engine for machine setup
- Configurable operator interfaces (HMI)
- Extremely granular permissions
- Native readiness for human operators to be replaced or assisted by AI agents in the future

Organizations operate in isolated spaces, with controlled access and a product that
can evolve from essential operational capabilities to broader enterprise needs.

## Main Domain

The core domain concepts are:

- **Tenant / Organization** — Isolated corporate account
- **User** — Belongs to one or more tenants, with granular roles and permissions
- **Device / Machine** — Digital representation of the physical machine
- **Form Definition** — Definition of dynamic forms (Setup Form and Operator Screen)
- **Rule Engine** — Rules engine that controls form and HMI behavior
- **Configuration / Setup** — Populated instance of a setup form (can be saved as a template)
- **Production Order** — Production order associated with a device
- **Telemetry / Signal** — Operational data received from industrial devices
- **KPI** — Indicators calculated from telemetry and orders
- **Operator Action** — Actions performed on the HMI (start an order, justify downtime, record a bad part, etc.)

## Main Journey and Features

### 1. Organization Onboarding (Multi-tenant)

- Creation of the corporate account (Tenant) + root user
- Logical data isolation by tenant from the outset
- Basic white-label (organization branding)

### 2. Authentication and Authorization

- Authentication and user management per tenant
- Highly granular permissions (not only generic roles)
- Fine-grained control over what each user can see and do within the tenant (including by device)

### 3. Device / Machine Management

- Registration of the device with high-level information (name, model, manufacturer, tags, location, etc.)
- Association of users authorized to operate that specific device
- Automatic generation of:
  - Connection information for sending telemetry
  - Access credentials for that connection

The connection information may become available after registration rather than immediately.

The information is sent by email to the user registering the device.

There is a possibility of sending the same credentials to other users' email addresses within the same organization.

### 4. Creation of Dynamic Setup Forms

- Dedicated screen for creating dynamic forms + Rule Engine
- The option only appears in the menu if the logged-in user has the specific permission
- The form defines fields, validations, conditional rules, calculations, and required fields
- Rules may vary according to machine model, country, device type, etc.

### 5. Device Setup (Operator or AI Agent)

- Application of the dynamic setup form to a specific device
- Can be performed by a human operator or, in the future, by an AI agent
- Setups can be saved and reused as versioned templates

### 6. Production Order Execution + HMI

- Listing of the production orders available for that device
- Configurable operator interface (HMI)
- Main HMI actions:
  - Start machine / production order
  - Justify downtime
  - Record bad parts / losses
  - Other actions defined through the dynamic form + rules

The same interface definition serves both humans and future AI agents.

### 7. IoT Data Collection and KPIs

- Reception of telemetry signals from industrial devices
- Transformation of raw data + production order events into KPIs
- Examples of KPIs: simplified OEE, Throughput, Uptime, Quality Rate, etc.

## Product Principles

- Everything configurable (forms, rules, HMI) is versionable
- Permissions are granular and evaluated both in the backend and in the interface
- The operator interface definition is treated as a contract (human or AI agent)
- Tenant isolation is mandatory in all layers
- Important business actions and changes remain traceable for operational accountability

## Roadmap Reference

Use these stages to discuss product evolution, not as evidence of current delivery
status or a commitment to a particular sprint. Confirm the relevant release scope
when planning an epic.

- **Foundation** — Domain, organization isolation, controlled access
- **MVP** — Corporate account, devices, dynamic forms + rule engine, setup
- **v1** — Templates, production orders, telemetry, basic KPIs
- **v2** — Full HMI and operator actions
- **v3** — AI insights + preparation for agents
- **Polish** — Advanced white-label, performance, observability, and demo
